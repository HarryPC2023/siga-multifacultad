<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGA Multifacultad - Debug Avance Curricular</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #f5f5f7;
            color: #1a1a1a;
        }

        .contenedor {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 18px 60px;
        }

        h1 {
            font-size: 18px;
        }

        p.aviso {
            font-size: 13px;
            color: #666;
        }

        button {
            font-size: 14px;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #6c3ce9;
            color: #fff;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: default;
        }

        #estado {
            margin: 14px 0;
            font-size: 13px;
        }

        #estado.error {
            color: #b4232a;
        }

        #salida {
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            line-height: 1.5;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 14px;
            max-height: 70vh;
            overflow: auto;
        }

        #btnCopiar {
            margin-top: 10px;
            background: #1a1a1a;
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <h1>🧪 Debug — Avance Curricular</h1>
        <p class="aviso">Herramienta temporal, solo para revisar cómo pdf.js extrae el texto del PDF antes de
            construir el parser real. Necesitas: la extensión SIGA Conector instalada, y una pestaña de INTRALU
            abierta con tu sesión activa.</p>
        <button id="btnProbar">Descargar y extraer texto</button>
        <div id="estado"></div>
        <pre id="salida"></pre>
        <button id="btnCopiar" style="display:none;">📋 Copiar todo el texto</button>
    </div>

    <script type="module" src="js/avance-curricular-debug.js"></script>
</body>

</html>
