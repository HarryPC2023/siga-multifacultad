<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGA Multifacultad - Mis notas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/tema-siga.css">
    <link rel="stylesheet" href="css/selector-personalizado.css">

    <style>
        body {
            margin: 0;
            background: var(--paper);
            font-family: var(--font-body);
            color: var(--ink);
        }

        /* ============================================================
           LAYOUT — un mismo panel de identidad que cambia de orientación
           según el espacio: apilado arriba en móvil, lateral fijo en
           escritorio. Diseñado primero para 375-420px y expandido desde
           ahí, no al revés.
           ============================================================ */
        .layout-identidad {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        @media (min-width: 900px) {
            .layout-identidad {
                flex-direction: row;
            }
        }

        /* ---------- Panel de identidad ---------- */
        .panel-identidad {
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--brand-morado) 0%, var(--brand-azul) 100%);
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        @media (min-width: 900px) {
            .panel-identidad {
                width: 260px;
                padding: 30px 22px;
                gap: 20px;
            }
        }

        .identidad-persona {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .identidad-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
            flex-shrink: 0;
            object-fit: cover;
        }

        @media (min-width: 900px) {
            .identidad-avatar {
                width: 50px;
                height: 50px;
                font-size: 19px;
            }
        }

        .identidad-nombre {
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            line-height: 1.2;
        }

        .identidad-codigo {
            color: var(--bg-lavanda);
            font-size: 11px;
        }

        .chip-facultad {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.14);
            border-left: 4px solid #fff;
            border-radius: 10px;
            padding: 10px 12px;
        }

        .chip-facultad__icono {
            width: 28px;
            height: 28px;
            object-fit: contain;
            background: #fff;
            border-radius: 8px;
            padding: 3px;
            flex-shrink: 0;
        }

        @media (min-width: 900px) {
            .chip-facultad__icono {
                width: 34px;
                height: 34px;
            }
        }

        .chip-facultad__nombre {
            color: #fff;
            font-weight: 700;
            font-size: 12px;
        }

        .chip-facultad__periodo {
            color: var(--bg-lavanda);
            font-size: 11px;
        }

        /* ---------- Herramientas de Análisis Académico: visibles desde
           el inicio, nunca escondidas en un submenú. ---------- */
        .fila-herramientas {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        @media (min-width: 900px) {
            .fila-herramientas {
                flex-direction: column;
                overflow: visible;
            }

            .panel-identidad .separador-panel {
                height: 1px;
                background: rgba(255, 255, 255, 0.2);
                margin: 4px 0;
            }

            .panel-identidad .marca-pie {
                margin-top: auto;
                font-family: var(--font-logo);
                color: #fff;
                opacity: .8;
                font-size: 14px;
            }
        }

        .chip-herramienta {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            text-align: left;
        }

        @media (min-width: 900px) {
            .chip-herramienta {
                padding: 12px 14px;
                font-size: 13px;
                white-space: normal;
            }
        }

        .chip-herramienta--meta {
            background: var(--bg-cian);
            color: var(--acento-cian);
        }

        .chip-herramienta--progreso {
            background: var(--bg-lavanda);
            color: var(--acento-lavanda);
        }

        .chip-herramienta--ruta {
            background: #EAF5C0;
            color: #6B7F00;
        }

        /* ---------- Contenido: "Mis notas" ---------- */
        .contenido-notas {
            flex-grow: 1;
            min-width: 0;
        }

        .contenido-notas__interior {
            max-width: 640px;
            margin: 0 auto;
            padding: 20px 18px 60px;
        }

        @media (min-width: 900px) {
            .contenido-notas__interior {
                max-width: 900px;
                padding: 32px 40px 60px;
            }
        }

        .encabezado-notas {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .encabezado-notas__marca {
            font-family: var(--font-logo);
            font-size: 18px;
            margin: 0;
        }

        .encabezado-notas__volver {
            font-size: 13px;
            color: var(--brand-morado);
            text-decoration: none;
            font-weight: 600;
        }

        .fila-selector-periodo {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 16px;
        }

        .fila-selector-periodo .campo-select-custom {
            flex: 1;
            position: relative;
        }

        .btn-eliminar-periodo {
            flex-shrink: 0;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background: #fff;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
        }

        .btn-eliminar-periodo:hover {
            background: #FBE1E1;
        }

        .card-promedio {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--brand-morado-tinte);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 20px;
            max-width: 480px;
        }

        .card-promedio__etiqueta {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-soft);
            letter-spacing: 0.02em;
        }

        .card-promedio__valor {
            font-family: var(--font-body);
            font-size: 24px;
            font-weight: 700;
            color: var(--brand-morado);
        }

        .banner-riesgo {
            display: none;
            background: #FDF1E4;
            border: 1px solid #E8A855;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .banner-riesgo.visible {
            display: block;
        }

        .banner-riesgo__titulo {
            font-weight: 600;
            color: #A65D00;
            margin: 0 0 4px;
        }

        .banner-riesgo__item {
            color: #7A4600;
        }

        /* ---------- Tarjetas de curso: promedio a la izquierda, créditos
           y estado con color propio, botón "Ingresar notas" celeste.
           Mismo lenguaje de color que el panel de identidad. ---------- */
        #listaCursos {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (min-width: 900px) {
            #listaCursos {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }
        }

        .curso-card {
            border: 1px solid #e8e3da;
            border-radius: 12px;
            padding: 14px;
            background: #fff;
            display: flex;
            gap: 12px;
        }

        .curso-card__promedio {
            background: #EAF5C0;
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 58px;
            flex-shrink: 0;
        }

        .curso-card__promedio-etiqueta {
            font-size: 8px;
            color: #6B7F00;
            font-weight: 700;
            letter-spacing: .3px;
            margin: 0;
        }

        .curso-card__promedio-valor {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 16px;
            color: #6B7F00;
            margin: 0;
        }

        .curso-card__cuerpo-principal {
            flex-grow: 1;
            min-width: 0;
        }

        .curso-card__nombre {
            font-weight: 600;
            font-size: 13px;
            margin: 0 0 6px;
        }

        .curso-card__meta-fila {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .curso-card__codigo {
            font-size: 11px;
            color: var(--ink-soft);
        }

        .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 8px;
        }

        .badge-creditos {
            background: var(--bg-lavanda);
            color: var(--acento-lavanda);
        }

        .badge-aprobado {
            background: #E1F5E9;
            color: #12703E;
        }

        .badge-riesgo {
            background: var(--bg-amarillo);
            color: var(--acento-amarillo);
        }

        .badge-critico {
            background: #FBE1E1;
            color: #B4232A;
        }

        .badge-pendiente {
            background: var(--bg-amarillo);
            color: var(--acento-amarillo);
        }

        .btn-ingresar-notas {
            background: var(--bg-cian);
            color: var(--acento-cian);
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
        }

        .curso-card__cuerpo {
            display: none;
            margin-top: 14px;
        }

        .curso-card__cuerpo.visible {
            display: block;
        }

        .grid-componentes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .componente {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .componente label {
            font-size: 10px;
            color: var(--ink-soft);
            text-align: center;
        }

        .componente input {
            font-family: var(--font-body);
            font-size: 14px;
            text-align: center;
            padding: 6px 4px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background: #fff;
            width: 100%;
            box-sizing: border-box;
        }

        .prom-pc {
            font-size: 12px;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }

        .prom-pc strong {
            color: var(--ink);
        }

        .caja-necesito {
            background: var(--brand-morado-tinte);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
        }

        .caja-necesito__titulo {
            font-weight: 600;
            color: var(--brand-morado);
            margin: 0 0 6px;
        }

        .caja-necesito__valor {
            font-weight: 700;
        }

        .caja-necesito__fila {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 1px dotted color-mix(in srgb, var(--brand-morado) 30%, transparent);
        }

        .caja-necesito__fila:last-of-type {
            border-bottom: none;
        }

        .caja-necesito__chip {
            font-weight: 700;
            font-size: 12px;
            color: var(--ink);
            background: color-mix(in srgb, var(--brand-morado) 12%, transparent);
            border-radius: 6px;
            padding: 3px 8px;
            white-space: nowrap;
        }

        .caja-necesito__supuesto {
            margin: 8px 0 0;
            font-size: 11px;
            font-style: italic;
            color: var(--ink-soft);
        }

        .aviso-sin-formula {
            font-size: 12px;
            color: var(--ink-soft);
            font-style: italic;
        }

        .estado-vacio {
            text-align: center;
            padding: 40px 0;
            color: var(--ink-soft);
            font-size: 14px;
        }

        /* ============================================================
           MODAL DE CONFIRMACIÓN — mismo patrón visual que producción.
           ============================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal-caja {
            background: #fff;
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .modal-icono {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .modal-titulo {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--brand-morado);
            margin: 0 0 8px;
        }

        .modal-mensaje {
            font-family: var(--font-body);
            font-size: 0.82rem;
            color: var(--ink-soft);
            line-height: 1.5;
            margin: 0 0 24px;
        }

        .modal-botones {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 700;
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            flex: 1;
        }

        .modal-btn-cancelar {
            background: #F3F4F6;
            color: var(--ink-soft);
        }

        .modal-btn-cancelar:hover {
            background: #E5E7EB;
        }

        .modal-btn-confirmar {
            background: #B4232A;
            color: #fff;
        }

        .modal-btn-confirmar:hover {
            background: #9C1E23;
        }

        /* ---------- Panel de Análisis Académico (🚧 en camino en este
           sandbox — el motor real vive hoy solo en producción SIGA, ver
           nota en analisisAcademico.js). ---------- */
        .aa-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 400;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .aa-overlay.visible {
            display: flex;
        }

        .aa-caja {
            background: #fff;
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .aa-caja__icono {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .aa-caja__titulo {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1rem;
            margin: 0 0 8px;
        }

        .aa-caja__desc {
            font-size: 0.85rem;
            color: var(--ink-soft);
            line-height: 1.6;
            margin: 0 0 18px;
        }

        .aa-caja__cerrar {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            background: var(--brand-morado);
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="layout-identidad">

        <!-- ===== Panel de identidad: horizontal arriba en móvil, lateral
             fijo en escritorio (ver media query arriba). Se llena con JS
             (pintarIdentidad en notas.js) desde el perfil real y la
             sesión — nunca datos elegidos a mano. ===== -->
        <div class="panel-identidad" id="panelIdentidad">
            <div class="identidad-persona">
                <div class="identidad-avatar" id="identidadAvatar">?</div>
                <div>
                    <div class="identidad-nombre" id="identidadNombre">Cargando…</div>
                    <div class="identidad-codigo" id="identidadCodigo"></div>
                </div>
            </div>

            <div class="chip-facultad" id="chipFacultad" style="display:none;">
                <img class="chip-facultad__icono" id="chipFacultadIcono" src="" alt="">
                <div>
                    <div class="chip-facultad__nombre" id="chipFacultadNombre"></div>
                    <div class="chip-facultad__periodo" id="chipFacultadPeriodo"></div>
                </div>
            </div>

            <div class="separador-panel"></div>

            <div class="fila-herramientas">
                <button type="button" class="chip-herramienta chip-herramienta--meta" data-aa="meta">
                    🎯 Meta del curso
                </button>
                <button type="button" class="chip-herramienta chip-herramienta--progreso" data-aa="progreso">
                    🗺️ Progreso de tu carrera
                </button>
                <button type="button" class="chip-herramienta chip-herramienta--ruta" data-aa="ruta">
                    🔗 Ruta del curso
                </button>
            </div>

            <div class="marca-pie">SIGA</div>
        </div>

        <!-- ===== Contenido: Mis notas ===== -->
        <div class="contenido-notas">
            <div class="contenido-notas__interior">
                <div class="encabezado-notas">
                    <h1 class="encabezado-notas__marca">Mis notas</h1>
                    <a class="encabezado-notas__volver" href="index.html">← Sincronizar otro periodo</a>
                </div>

                <div class="fila-selector-periodo">
                    <div class="campo-select-custom">
                        <button type="button" class="select-custom-trigger" id="selectorPeriodoTrigger"
                            aria-haspopup="listbox" aria-expanded="false">
                            <span id="selectorPeriodoTexto">Elige un periodo</span>
                            <span class="select-custom-chevron" aria-hidden="true">▾</span>
                        </button>
                        <ul class="select-custom-lista" id="selectorPeriodoLista" role="listbox" hidden></ul>
                        <input type="hidden" id="selectorPeriodoValor">
                    </div>
                    <button type="button" class="btn-eliminar-periodo" id="btnEliminarPeriodo"
                        aria-label="Eliminar este periodo">🗑️</button>
                </div>

                <div class="card-promedio">
                    <span class="card-promedio__etiqueta">PROMEDIO PONDERADO</span>
                    <span class="card-promedio__valor" id="promedioPonderado">--</span>
                </div>

                <div class="banner-riesgo" id="bannerRiesgo">
                    <p class="banner-riesgo__titulo">⚠ Cursos en riesgo</p>
                    <div id="bannerRiesgoLista"></div>
                </div>

                <div id="listaCursos"></div>
                <div class="estado-vacio" id="estadoVacio" style="display:none;">Aún no sincronizas ningún curso.
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: eliminar el periodo actualmente seleccionado. -->
    <div id="modalEliminarPeriodo" class="modal-overlay">
        <div class="modal-caja">
            <div class="modal-icono">🗑️</div>
            <h2 class="modal-titulo">¿Eliminar este periodo?</h2>
            <p class="modal-mensaje" id="modalEliminarPeriodoTexto">Se eliminará por completo este periodo, con
                todos sus cursos y notas. No se puede deshacer.</p>
            <div class="modal-botones">
                <button type="button" class="modal-btn modal-btn-cancelar"
                    id="btnCancelarEliminarPeriodo">Cancelar</button>
                <button type="button" class="modal-btn modal-btn-confirmar" id="btnConfirmarEliminarPeriodo">Sí,
                    eliminar</button>
            </div>
        </div>
    </div>

    <!-- Panel de Análisis Académico — hoy muestra un estado honesto de
         "en camino" para las 3 herramientas: el motor real (Meta del
         curso, Progreso de tu carrera, Ruta del Curso) vive en
         producción SIGA y todavía no se portó a este sandbox. -->
    <div id="aaOverlay" class="aa-overlay">
        <div class="aa-caja">
            <div class="aa-caja__icono" id="aaIcono">🚧</div>
            <h2 class="aa-caja__titulo" id="aaTitulo">En camino</h2>
            <p class="aa-caja__desc" id="aaDesc"></p>
            <button type="button" class="aa-caja__cerrar" id="aaCerrar">Entendido</button>
        </div>
    </div>

    <script src="js/selector-personalizado.js"></script>
    <script type="module" src="js/notas.js"></script>
</body>

</html>
