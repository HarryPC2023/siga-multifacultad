<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGA Multifacultad - Mis notas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/tema-siga.css">
    <link rel="stylesheet" href="css/selector-personalizado.css">

    <style>
        body {
            margin: 0;
            background: var(--paper);
            font-family: var(--font-body);
            color: var(--ink);
        }

        .contenedor-notas {
            max-width: 640px;
            margin: 0 auto;
            padding: 24px 18px 60px;
        }

        .encabezado-notas {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .encabezado-notas__marca {
            font-family: var(--font-logo);
            font-size: 20px;
            color: var(--brand-morado);
            margin: 0;
        }

        .encabezado-notas__volver {
            font-size: 13px;
            color: var(--brand-morado);
            text-decoration: none;
            font-weight: 600;
        }

        .fila-selector-periodo {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 16px;
        }

        .fila-selector-periodo .campo-select-custom {
            flex: 1;
            position: relative;
        }

        .btn-eliminar-periodo {
            flex-shrink: 0;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background: #fff;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
        }

        .btn-eliminar-periodo:hover {
            background: #FBE1E1;
        }

        .card-promedio {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--brand-azul-tinte);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 12px;
        }

        .card-promedio__etiqueta {
            font-size: 12px;
            color: var(--ink-soft);
            letter-spacing: 0.02em;
        }

        .card-promedio__valor {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px;
            font-weight: 700;
            color: var(--brand-azul);
        }

        .banner-riesgo {
            display: none;
            background: #FDF1E4;
            border: 1px solid #E8A855;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .banner-riesgo.visible {
            display: block;
        }

        .banner-riesgo__titulo {
            font-weight: 600;
            color: #A65D00;
            margin: 0 0 4px;
        }

        .banner-riesgo__item {
            color: #7A4600;
        }

        .curso-card {
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            padding: 16px 0;
        }

        .curso-card__cabecera {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
        }

        .curso-card__nombre {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 2px;
        }

        .curso-card__meta {
            font-size: 11px;
            color: var(--ink-soft);
        }

        .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .badge-aprobado {
            background: #E1F5E9;
            color: #12703E;
        }

        .badge-riesgo {
            background: #FDF1E4;
            color: #A65D00;
        }

        .badge-critico {
            background: #FBE1E1;
            color: #B4232A;
        }

        .badge-pendiente {
            background: #EFEFEF;
            color: var(--ink-soft);
        }

        .curso-card__promedio {
            text-align: right;
            flex-shrink: 0;
        }

        .curso-card__promedio-etiqueta {
            font-size: 10px;
            color: var(--ink-soft);
            margin: 0;
        }

        .curso-card__promedio-valor {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            margin: 0;
        }

        .curso-card__cuerpo {
            display: none;
            margin-top: 14px;
        }

        .curso-card__cuerpo.visible {
            display: block;
        }

        .grid-componentes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .componente {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .componente label {
            font-size: 10px;
            color: var(--ink-soft);
            text-align: center;
        }

        .componente input {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            text-align: center;
            padding: 6px 4px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background: #fff;
            width: 100%;
            box-sizing: border-box;
        }

        .prom-pc {
            font-size: 12px;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }

        .prom-pc strong {
            font-family: 'JetBrains Mono', monospace;
            color: var(--ink);
        }

        .caja-necesito {
            background: var(--brand-morado-tinte);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
        }

        .caja-necesito__titulo {
            font-weight: 600;
            color: var(--brand-morado);
            margin: 0 0 6px;
        }

        .caja-necesito__valor {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }

        .aviso-sin-formula {
            font-size: 12px;
            color: var(--ink-soft);
            font-style: italic;
        }

        .estado-vacio {
            text-align: center;
            padding: 40px 0;
            color: var(--ink-soft);
            font-size: 14px;
        }

        /* ============================================================
           MODAL DE CONFIRMACIÓN — mismo patrón visual que producción
           (icono + título + mensaje + 2 botones), con los tokens de
           color del sandbox en vez de las variables viejas de SIGA.
           ============================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal-caja {
            background: #fff;
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .modal-icono {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .modal-titulo {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--brand-morado);
            margin: 0 0 8px;
        }

        .modal-mensaje {
            font-family: var(--font-body);
            font-size: 0.82rem;
            color: var(--ink-soft);
            line-height: 1.5;
            margin: 0 0 24px;
        }

        .modal-botones {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 700;
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            flex: 1;
        }

        .modal-btn-cancelar {
            background: #F3F4F6;
            color: var(--ink-soft);
        }

        .modal-btn-cancelar:hover {
            background: #E5E7EB;
        }

        .modal-btn-confirmar {
            background: #B4232A;
            color: #fff;
        }

        .modal-btn-confirmar:hover {
            background: #9C1E23;
        }
    </style>
</head>

<body>
    <div class="contenedor-notas">
        <div class="encabezado-notas">
            <p class="encabezado-notas__marca">SIGA · Mis notas</p>
            <a class="encabezado-notas__volver" href="login.html">← Sincronizar otro periodo</a>
        </div>

        <div class="fila-selector-periodo">
            <div class="campo-select-custom">
                <button type="button" class="select-custom-trigger" id="selectorPeriodoTrigger" aria-haspopup="listbox"
                    aria-expanded="false">
                    <span id="selectorPeriodoTexto">Elige un periodo</span>
                    <span class="select-custom-chevron" aria-hidden="true">▾</span>
                </button>
                <ul class="select-custom-lista" id="selectorPeriodoLista" role="listbox" hidden></ul>
                <input type="hidden" id="selectorPeriodoValor">
            </div>
            <button type="button" class="btn-eliminar-periodo" id="btnEliminarPeriodo"
                aria-label="Eliminar este periodo">🗑️</button>
        </div>

        <div class="card-promedio">
            <span class="card-promedio__etiqueta">PROMEDIO PONDERADO</span>
            <span class="card-promedio__valor" id="promedioPonderado">--</span>
        </div>

        <div class="banner-riesgo" id="bannerRiesgo">
            <p class="banner-riesgo__titulo">⚠ Cursos en riesgo</p>
            <div id="bannerRiesgoLista"></div>
        </div>

        <div id="listaCursos"></div>
        <div class="estado-vacio" id="estadoVacio" style="display:none;">Aún no sincronizas ningún curso.</div>
    </div>

    <!-- Modal: eliminar el periodo actualmente seleccionado (todas sus
         notas en notas_curso para este alumno; formulas_curso NO se toca,
         es compartida con otros alumnos del mismo curso). -->
    <div id="modalEliminarPeriodo" class="modal-overlay">
        <div class="modal-caja">
            <div class="modal-icono">🗑️</div>
            <h2 class="modal-titulo">¿Eliminar este periodo?</h2>
            <p class="modal-mensaje" id="modalEliminarPeriodoTexto">Se eliminará por completo este periodo, con
                todos sus cursos y notas. No se puede deshacer.</p>
            <div class="modal-botones">
                <button type="button" class="modal-btn modal-btn-cancelar"
                    id="btnCancelarEliminarPeriodo">Cancelar</button>
                <button type="button" class="modal-btn modal-btn-confirmar" id="btnConfirmarEliminarPeriodo">Sí,
                    eliminar</button>
            </div>
        </div>
    </div>

    <script src="js/selector-personalizado.js"></script>
    <script type="module" src="js/notas.js"></script>
</body>

</html>
